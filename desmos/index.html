<!DOCTYPE html>
<html lang="en_us">
	<head>
		<link rel="stylesheet" href="/desmos/desmos.css" />
		<link rel="icon" href="/_/desmos/assets/img/apps/graphing/favicon.ico" type="image/x-icon">
		<meta property="og:site_name" content="Desmos">
		<meta content="Desmos" property="og:title" />
		<meta content="Graphing Calculator (modded)" property="og:description" />
		<meta content="https://cootshk.dev/desmos" property="og:url" />
		<meta content="https://i3.ytimg.com/vi/pX7nsPPWYy0/maxresdefault.jpg" property="og:image" />
		<meta content="#187A3D" data-react-helmet="true" name="theme-color" />
		<title>Desmos | Graphing Calculator (modded)</title>
		<script src="/cdn/common.js" defer></script>
		<script src="/cdn/fengari-web.js" defer></script>
		<script src="/desmos/extensions.js" defer></script>
		<script src="/desmos/ui.js" defer></script>
		<script src="/desmos/desmos.js" defer></script>
	</head>
	<body>
		<!-- populated by JS -->
		<iframe id="desmos" title="Desmos"></iframe>

		<!-- Populated by extensionSettings(). Only reachable when ?ext= is absent. -->
		<div id="ext-ui">
			<div id="ext-panel" hidden>
				<strong>Extensions</strong>
				<div id="ext-list"></div>
				<p id="ext-note" hidden>?ext= in the URL is overriding these.</p>
				<button id="ext-reload" type="button" hidden>Reload</button>
			</div>
			<button id="ext-toggle" type="button" title="Extensions" aria-label="Extensions">&#9881;</button>
		</div>
	</body>
</html>
